<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jelajah Dunia Edukasi - Adventure Edition</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#22c55e;--g2:#16a34a;--ink:#1f3a2e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#dff5e1,#e0f1ff 55%,#fff3d6);overflow:hidden}
h1,h2,h3,.title{font-family:'Baloo 2','Nunito',sans-serif;margin:0}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:none;overflow:auto}
.screen.active{display:block}
#s-game{overflow:hidden;background:#bfe3a2}
.card{background:#fff;border-radius:1.5rem;box-shadow:0 10px 30px rgba(31,58,46,.16);padding:1.25rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.7rem 1.2rem;border-radius:1rem;font-weight:800;font-family:inherit;font-size:1rem;border:0;cursor:pointer;transition:transform .12s,box-shadow .12s;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-green{background:#22c55e;color:#fff}.btn-blue{background:#3b82f6;color:#fff}.btn-amber{background:#f59e0b;color:#fff}.btn-red{background:#ef4444;color:#fff}.btn-ghost{background:#fff;color:var(--ink);border:2px solid #d8e9dc}
.input{width:100%;padding:.75rem 1rem;border-radius:1rem;border:3px solid #d1e7d6;font-size:1rem;font-weight:700;font-family:inherit;outline:0;background:#fff;color:var(--ink)}
.input:focus{border-color:#22c55e}
.lbl{display:block;font-weight:800;font-size:.9rem;margin-bottom:.25rem}
.avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
@media(min-width:640px){.avatar-grid{grid-template-columns:repeat(6,1fr)}}
.av{border:4px solid transparent;border-radius:1.2rem;background:#f1f8ee;cursor:pointer;padding:.2rem .2rem .3rem;display:flex;flex-direction:column;align-items:center;transition:.15s;font-weight:800;font-size:.8rem}
.av.sel{border-color:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.3),0 0 22px 6px rgba(34,197,94,.55);background:#e8ffe9;transform:scale(1.05)}
.av canvas{width:100%;height:auto;display:block}
#cfgBtn{position:fixed;top:10px;right:10px;z-index:5;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.7);opacity:.45;font-size:18px;cursor:pointer}
#cfgBtn:hover{opacity:1}
/* HUD */
.hud{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
.pill{background:rgba(255,255,255,.93);border-radius:999px;padding:.35rem .9rem;font-weight:800;font-size:.9rem;box-shadow:0 3px 10px rgba(0,0,0,.18);font-family:inherit;color:var(--ink);border:0}
.mission{flex:1 1 220px;min-width:0;background:linear-gradient(90deg,#fde68a,#fcd34d);text-align:center}
.hudbtns{margin-left:auto;display:flex;gap:6px}
.hbtn{cursor:pointer}
#tip{position:absolute;transform:translate(-50%,-100%);background:#fff;border:3px solid #22c55e;border-radius:999px;padding:.3rem .8rem;font-weight:800;font-size:.85rem;box-shadow:0 6px 16px rgba(0,0,0,.22);display:none;cursor:pointer;white-space:nowrap;z-index:6}
#tip.lock{border-color:#f59e0b}
#touch{display:none;position:absolute;inset:0;pointer-events:none;z-index:7}
@media (pointer:coarse),(max-width:820px){#touch{display:block}}
#dpad{position:absolute;left:14px;bottom:22px;display:grid;grid-template:repeat(3,58px)/repeat(3,58px);gap:4px;pointer-events:auto}
.dp{border:0;border-radius:16px;background:rgba(255,255,255,.8);font-size:22px;box-shadow:0 4px 0 rgba(0,0,0,.2);touch-action:none;user-select:none;color:var(--ink)}
.dp:active{background:#bbf7d0}
#actBtn{position:absolute;right:20px;bottom:36px;width:88px;height:88px;border-radius:50%;border:0;background:#9ca3af;color:#fff;font-weight:800;font-size:28px;line-height:1;box-shadow:0 6px 0 rgba(0,0,0,.25);pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;touch-action:none}
#actBtn small{font-size:10px;margin-top:2px}
#actBtn.ready{background:#22c55e;animation:glow 1s infinite}
@keyframes glow{0%,100%{box-shadow:0 6px 0 rgba(0,0,0,.25),0 0 0 0 rgba(34,197,94,.7)}50%{box-shadow:0 6px 0 rgba(0,0,0,.25),0 0 0 16px rgba(34,197,94,0)}}
/* Modal */
#modal{position:fixed;inset:0;background:rgba(20,40,30,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:10px}
#modal.show{display:flex}
#mbox{width:100%;max-width:760px;max-height:94vh;overflow:auto;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.mh{display:flex;align-items:center;gap:.8rem;margin-bottom:.8rem}
.mem{font-size:2.6rem;width:66px;height:66px;border-radius:50%;background:#e8ffe9;border:4px solid #86efac;display:flex;align-items:center;justify-content:center;flex:none}
.mt{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.4rem;line-height:1.1}
.ms{font-size:.85rem;font-weight:700;color:#5b7a6a}
.xbtn{margin-left:auto;border:0;background:#f1f5f2;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:14px;flex:none}
.bubble{background:#f0fdf4;border:3px solid #bbf7d0;border-radius:1.2rem;padding:1rem 1.1rem;font-size:1.1rem;font-weight:700;min-height:120px;line-height:1.5}
.row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.9rem}
.row.end{justify-content:flex-end}
.dots{display:flex;gap:6px;justify-content:center;margin-top:.7rem}
.dots i{width:9px;height:9px;border-radius:50%;background:#d1e7d6}
.dots i.on{background:#22c55e}
.lead{font-weight:700;margin:.3rem 0 .7rem}
.qtxt{font-size:1.15rem;font-weight:800;margin:.4rem 0 .7rem}
.qimg{font-size:3rem;text-align:center;background:#f0f9ff;border-radius:1rem;padding:.4rem;margin-bottom:.6rem}
.opts{display:grid;gap:.5rem}
.opt{display:flex;gap:.6rem;align-items:center;width:100%;text-align:left;padding:.75rem 1rem;border-radius:1rem;border:3px solid #d8e9dc;background:#fff;font-weight:700;font-size:1rem;font-family:inherit;color:var(--ink);cursor:pointer;transition:.12s}
.opt:hover{border-color:#22c55e;transform:translateY(-2px)}
.opt.ok{background:#dcfce7;border-color:#22c55e}
.opt.bad{background:#fee2e2;border-color:#ef4444;animation:shake .35s}
.opt.dis{pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fb{margin-top:.7rem;border-radius:1rem;padding:.7rem 1rem;font-weight:700;background:#f8fafc;border:2px dashed #cbd5e1;min-height:48px}
.fb.good{background:#ecfdf5;border-color:#86efac}.fb.warn{background:#fff7ed;border-color:#fdba74}
.prog{height:10px;border-radius:99px;background:#e5efe8;overflow:hidden;margin-bottom:.5rem}
.prog i{display:block;height:100%;background:#22c55e;transition:width .3s}
.chain{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;margin:.4rem 0}
.slot{width:78px;min-height:84px;border:3px dashed #a7d7b4;border-radius:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.9rem;font-weight:800;color:#9ec9aa;text-align:center;padding:4px}
.slot small{font-size:.65rem;color:var(--ink);line-height:1.1;font-weight:800}
.slot small.role{color:#16a34a}
.slot.fill{border-style:solid;border-color:#22c55e;background:#ecfdf5;color:inherit;animation:pop .3s}
.arr{font-size:1.2rem;font-weight:800;color:#16a34a}
.pool{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin-top:.7rem}
.pcard{width:92px;padding:.5rem .3rem;border-radius:1rem;border:3px solid #d8e9dc;background:#fff;cursor:pointer;font-family:inherit;color:var(--ink);transition:.12s}
.pcard:hover{border-color:#22c55e;transform:translateY(-3px)}
.pcard .pe{font-size:2rem}.pcard .pn{font-size:.78rem;font-weight:800}
.pcard.used{opacity:.35;pointer-events:none}
.pcard.bad{border-color:#ef4444;background:#fee2e2;animation:shake .35s}
.pcard.sel{border-color:#f59e0b;background:#fffbeb}
.pcard:disabled{opacity:.4;pointer-events:none}
.bars{display:grid;gap:6px;margin-top:.8rem}
.brow{display:flex;align-items:center;gap:8px}
.be{font-size:1.4rem;width:34px;text-align:center}
.bt{flex:1;height:18px;border-radius:99px;background:#e8eff0;overflow:hidden}
.bf{height:100%;border-radius:99px;background:linear-gradient(90deg,#4ade80,#22c55e);transition:width 1s ease,background .5s}
.bf.up{background:linear-gradient(90deg,#60a5fa,#3b82f6)}.bf.down{background:linear-gradient(90deg,#fbbf24,#f97316)}.bf.gone{background:#cbd5e1}
.bv{width:34px;text-align:right;font-weight:800;font-size:.85rem}
.celebrate{text-align:center;position:relative;overflow:hidden;padding:.5rem}
.trophy{font-size:5rem;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.conf{position:absolute;top:-30px;font-size:1.4rem;animation:fall 2.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(520px) rotate(360deg);opacity:.2}}
.stars{font-size:2.2rem;letter-spacing:6px}
.err{color:#dc2626;font-weight:800;font-size:.85rem;min-height:1.1rem}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;font-weight:600}
.chk{display:flex;gap:.5rem;align-items:flex-start;font-weight:700;margin:.25rem 0}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:#22c55e}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#1f3a2e;color:#fff;padding:.55rem 1.1rem;border-radius:999px;font-weight:800;z-index:90;opacity:0;pointer-events:none;transition:opacity .25s;max-width:92vw;text-align:center}
#toast.show{opacity:1}
/* Report */
.cert{max-width:820px;margin:0 auto;border:6px double #22c55e}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin:1rem 0}
@media(min-width:640px){.metrics{grid-template-columns:repeat(4,1fr)}}
.met{background:#f0fdf4;border-radius:1rem;padding:.7rem;text-align:center}
.met b{display:block;font-family:'Baloo 2',sans-serif;font-size:1.7rem;line-height:1.1}
.met span{font-size:.78rem;font-weight:800;color:#5b7a6a}
table.mt2{width:100%;border-collapse:collapse}
.mt2 th{text-align:left;font-size:.8rem;color:#5b7a6a;padding:.35rem}
.mt2 td{padding:.45rem .35rem;border-top:1px solid #e5efe8;font-weight:700}
.pb{height:14px;background:#e5efe8;border-radius:99px;overflow:hidden;min-width:100px}
.pb i{display:block;height:100%;background:linear-gradient(90deg,#4ade80,#16a34a)}
.pc{width:64px;text-align:right}
@media print{
 html,body{overflow:visible!important;height:auto!important;background:#fff!important}
 .no-print{display:none!important}
 .screen{position:static!important;overflow:visible!important}
 #s-reg,#s-game,#modal,#toast,#cfgBtn{display:none!important}
 .cert{box-shadow:none!important}
 @page{size:A4;margin:12mm}
}
</style>
</head>
<body>
<noscript>Aktifkan JavaScript untuk memainkan game ini.</noscript>
<div id="toast"></div>
<button id="cfgBtn" class="no-print" title="Pengaturan Guru">⚙️</button>

<!-- LAYAR 1: REGISTRASI -->
<section id="s-reg" class="screen">
  <div class="mx-auto p-4 pb-10" style="max-width:780px">
    <header class="text-center pt-4 pb-3">
      <div style="font-size:3rem">🌳🦋🔬</div>
      <h1 id="regTitle" class="text-3xl font-extrabold" style="font-size:2rem;line-height:1.1"></h1>
      <p id="regSub" class="font-bold" style="color:#5b7a6a;margin:.4rem 0 0"></p>
    </header>
    <div class="card">
      <h2 style="font-size:1.4rem">🧭 Profil Penjelajah</h2>
      <div style="display:grid;gap:.8rem;margin:.8rem 0">
        <div><label class="lbl" for="inName">Nama Penjelajah</label><input id="inName" class="input" maxlength="40" placeholder="Tuliskan namamu..." autocomplete="off"></div>
        <div><label class="lbl" for="inKelas">Kelas / Ruang</label><input id="inKelas" class="input" maxlength="15" placeholder="Contoh: 5A / 5B..." autocomplete="off"></div>
      </div>
      <h3 style="font-size:1.15rem;margin-bottom:.5rem">🧑‍🚀 Pilih Avatar Karakter</h3>
      <div id="avGrid" class="avatar-grid"></div>
      <button id="startBtn" class="btn btn-green" style="width:100%;font-size:1.3rem;margin-top:1.2rem;padding:.9rem">Masuk Dunia Jelajah 🚀</button>
    </div>
  </div>
</section>

<!-- LAYAR 2: DUNIA -->
<section id="s-game" class="screen">
  <canvas id="cv" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none"></canvas>
  <div class="hud">
    <div class="pill" id="hudInfo"></div>
    <div class="pill mission" id="hudMission"></div>
    <div class="hudbtns">
      <button id="audBtn" class="pill hbtn" title="Audio">🔊</button>
      <button id="endBtn" class="pill hbtn">🏁 Selesai</button>
    </div>
  </div>
  <div id="tip"></div>
  <div id="touch">
    <div id="dpad">
      <button class="dp" data-d="up" style="grid-area:1/2">▲</button>
      <button class="dp" data-d="left" style="grid-area:2/1">◀</button>
      <button class="dp" data-d="right" style="grid-area:2/3">▶</button>
      <button class="dp" data-d="down" style="grid-area:3/2">▼</button>
    </div>
    <button id="actBtn">E<small>INTERAKSI</small></button>
  </div>
</section>

<!-- LAYAR 3: LAPORAN -->
<section id="s-rep" class="screen">
  <div class="p-3 pb-10">
    <div id="repBody" class="card cert"></div>
    <div class="no-print" style="display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin:1.2rem 0">
      <button id="btnCsv" class="btn btn-blue">📥 Unduh Laporan CSV</button>
      <button id="btnPrint" class="btn btn-amber">🖨️ Cetak / Simpan PDF</button>
      <button id="btnAgain" class="btn btn-green">🔄 Jelajah Ulang</button>
    </div>
  </div>
</section>

<div id="modal"><div id="mbox" class="card"></div></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const LS_STATE='jde_state_v2', LS_CFG='jde_config_v2';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

/* ============ KONTEN DEFAULT (dapat diganti guru via JSON) ============ */
const DEFAULT_CONTENT={
 z1:{name:'Rumah Konsep Dasar',npc:'Dr. Rimba',emoji:'👩‍🔬',sub:'Komponen Ekosistem',
  dialog:[
   'Halo, {nama}! Selamat datang di Hutan Pengetahuan. Aku Dr. Rimba, ahli ekologi. 🌿',
   'Ekosistem adalah hubungan saling memengaruhi antara makhluk hidup dan lingkungan tempat mereka hidup.',
   'Komponen biotik adalah makhluk hidup: tumbuhan, hewan, jamur, dan bakteri. Komponen abiotik adalah benda tak hidup: air, cahaya matahari, tanah, udara, dan suhu.',
   'Di hutan, tumbuhan hijau disebut produsen karena membuat makanan sendiri lewat fotosintesis. Hewan pemakan tumbuhan atau hewan lain disebut konsumen.',
   'Jamur dan bakteri adalah pengurai. Mereka menguraikan sisa makhluk hidup menjadi zat hara yang menyuburkan tanah.',
   'Nah, ayo uji pemahamanmu dengan beberapa pertanyaan singkat! Soalmu bisa berbeda dengan temanmu, lho.'],
  pick:3,
  check:[
   {q:'Manakah yang termasuk komponen abiotik di hutan?',o:['🌳 Pohon jati','💧 Air sungai','🐒 Monyet','🍄 Jamur'],a:1,w:'Air adalah benda tak hidup, jadi termasuk komponen abiotik. Pohon, monyet, dan jamur adalah makhluk hidup (biotik).'},
   {q:'Mengapa tumbuhan hijau disebut produsen?',o:['Karena membuat makanan sendiri lewat fotosintesis','Karena memakan serangga kecil','Karena mengurai daun kering','Karena hanya hidup di dalam tanah'],a:0,w:'Dengan bantuan cahaya matahari, tumbuhan hijau membuat makanannya sendiri melalui fotosintesis.'},
   {q:'Apa peran jamur dan bakteri di hutan?',o:['Produsen utama','Pengurai sisa makhluk hidup','Pemangsa puncak','Penghasil cahaya'],a:1,w:'Pengurai mengubah sisa makhluk hidup menjadi zat hara yang menyuburkan tanah.'},
   {q:'Cahaya matahari di hutan termasuk komponen apa?',o:['Biotik','Abiotik','Konsumen','Pengurai'],a:1,w:'Cahaya matahari adalah benda tak hidup yang dibutuhkan tumbuhan, jadi termasuk komponen abiotik.'},
   {q:'Hewan yang makan tumbuhan atau hewan lain disebut...',o:['Produsen','Konsumen','Pengurai','Abiotik'],a:1,w:'Konsumen tidak bisa membuat makanan sendiri sehingga harus memakan makhluk hidup lain.'},
   {q:'Manakah contoh interaksi makhluk hidup dengan lingkungannya?',o:['Pohon menyerap air dan zat hara dari tanah','Batu menggelinding di sungai','Awan bergerak tertiup angin','Pasir terbawa ombak'],a:0,w:'Pohon (biotik) mengambil air dan zat hara dari tanah (abiotik). Itulah interaksi dalam ekosistem.'},
   {q:'Apa yang terjadi jika di hutan tidak ada pengurai?',o:['Sisa daun dan bangkai menumpuk dan tanah kurang subur','Hutan menjadi jauh lebih subur','Semua hewan menjadi produsen','Hujan berhenti turun'],a:0,w:'Tanpa pengurai, sisa makhluk hidup tidak diubah menjadi zat hara sehingga tanah kurang subur.'},
   {q:'Proses tumbuhan hijau membuat makanan dengan bantuan cahaya matahari disebut...',o:['Fotosintesis','Pernapasan','Penguraian','Penyerbukan'],a:0,w:'Fotosintesis mengubah air, karbon dioksida, dan cahaya matahari menjadi makanan dan oksigen.'},
   {q:'Manakah yang semuanya termasuk komponen biotik?',o:['Burung, jamur, dan pohon','Air, batu, dan udara','Tanah, cahaya, dan suhu','Awan, angin, dan hujan'],a:0,w:'Biotik adalah makhluk hidup: burung, jamur, dan pohon. Lainnya adalah benda tak hidup.'},
   {q:'Mengapa jamur dan bakteri disebut penyubur tanah di hutan?',o:['Karena menguraikan sisa makhluk hidup menjadi zat hara','Karena menyinari tanah','Karena memakan semua pohon','Karena menghasilkan air hujan'],a:0,w:'Hasil penguraian berupa zat hara diserap kembali oleh akar tumbuhan.'}]},
 z2:{name:'Laboratorium Eksperimen',npc:'Robo-Lab',emoji:'🤖',sub1:'Rantai Makanan',sub2:'Keseimbangan Ekosistem',
  intro:['Selamat datang di Laboratorium Eksperimen, {nama}! Bip-bip! 🤖','Hari ini kamu akan menyusun rantai makanan hutan, lalu menguji apa yang terjadi jika satu makhluk hidup hilang.','Ingat: tanda ➜ berarti "dimakan oleh". Siap bereksperimen?'],
  chain:[{e:'🌿',n:'Rumput',r:'Produsen'},{e:'🦗',n:'Belalang',r:'Konsumen I'},{e:'🐸',n:'Katak',r:'Konsumen II'},{e:'🐍',n:'Ular',r:'Konsumen III'},{e:'🦅',n:'Elang',r:'Konsumen puncak'}],
  extra:{e:'🍄',n:'Jamur',r:'Pengurai',note:'Jamur adalah pengurai. Ia menguraikan sisa semua makhluk hidup, bukan bagian dari urutan pemangsaan.'}},
 z3:{name:'Arena Peneliti',npc:'Prof. Elang',emoji:'🧑‍🏫',sub:'Studi Kasus & Aksi Nyata',
  intro:['Selamat datang di Arena Peneliti, {nama}! Aku Prof. Elang. 🦅','Kamu akan menghadapi studi kasus nyata tentang hutan. Kamu perlu minimal 60% jawaban benar untuk mendapat lencana. Semangat!'],

function contentErr(o){
 try{
  if(!o||typeof o!=='object')throw 'Konten harus berupa objek JSON.';
  const qs=(a,nm)=>{if(!Array.isArray(a)||!a.length)throw nm+' harus berupa daftar (array) dan tidak boleh kosong.';a.forEach((x,i)=>{if(!x||typeof x.q!=='string'||!Array.isArray(x.o)||x.o.length<2||!Number.isInteger(x.a)||x.a<0||x.a>=x.o.length)throw nm+' nomor '+(i+1)+': wajib ada q (teks soal), o (minimal 2 opsi), dan a (nomor indeks jawaban benar, mulai 0).';});};
  for(const k of ['z1','z2','z3']){const z=o[k];if(!z||typeof z!=='object')throw 'Bagian '+k+' tidak ditemukan.';if(!z.name||!z.npc||!z.emoji)throw k+' wajib punya name, npc, dan emoji.';}
  if(!Array.isArray(o.z1.dialog)||!o.z1.dialog.length)throw 'z1.dialog harus berupa daftar kalimat.';
  qs(o.z1.check,'z1.check');
  if(!Array.isArray(o.z2.intro)||!o.z2.intro.length)throw 'z2.intro harus berupa daftar kalimat.';
  if(!Array.isArray(o.z2.chain)||o.z2.chain.length<3||o.z2.chain.length>7||o.z2.chain.some(c=>!c||!c.e||!c.n))throw 'z2.chain harus 3-7 item dengan e (emoji), n (nama), r (peran).';

 }catch(e){return String(e);}
}

 if(id===1)dialog(z,z.dialog,()=>runQuiz({id:1,z,qs:getQs(1),key:'k1',pts:10,min:0,title:'Cek Pemahaman'}));
 else if(id===2)dialog(z,z.intro,()=>builder(z));
 else dialog(z,z.intro,()=>runQuiz({id:3,z,qs:getQs(3),key:'k3',pts:10,min:60,title:'Tantangan Studi Kasus'}));
}
function runQuiz(o){
 const{z,qs,key,pts,min}=o;let i=0,right=0;
 const render=()=>{
  const q=qs[i],opts=shuffle(q.o.map((t,ix)=>({t,ok:ix===q.a})));
  openModal(`${mHead(z.emoji,o.title,z.name+(practice?' • Latihan ulang (skor tidak bertambah)':''))}
   <div class="prog"><i style="width:${i/qs.length*100}%"></i></div>
   <div style="font-weight:800;font-size:.85rem;color:#5b7a6a">Pertanyaan ${i+1} dari ${qs.length}</div>
   ${q.img?`<div class="qimg">${esc(q.img)}</div>`:''}
   <div class="qtxt">${esc(q.q)}</div>
   <div class="opts">${opts.map((p,j)=>`<button class="opt" data-j="${j}"><span>${esc(p.t)}</span></button>`).join('')}</div>
   <div id="fb" class="fb hidden"></div>
   <div class="row end"><button id="qNx" class="btn btn-green hidden">${i===qs.length-1?'Lihat Hasil ▶':'Lanjut ▶'}</button></div>`);
  let answered=false;
  $$('#mbox .opt').forEach(b=>b.onclick=()=>{
   if(answered)return;answered=true;
   const p=opts[+b.dataset.j];
   $$('#mbox .opt').forEach((e,j)=>{e.classList.add('dis');if(opts[j].ok)e.classList.add('ok');});
   if(p.ok){right++;sfx.ok();b.classList.add('ok');}else{sfx.bad();b.classList.add('bad');}
   award(key,p.ok,pts);
   const fb=$('#fb');fb.classList.remove('hidden');fb.classList.add(p.ok?'good':'warn');
   fb.textContent=(p.ok?`✅ Benar! +${practice?0:pts} poin. `:'💡 Belum tepat. ')+(q.w||'');
   $('#qNx').classList.remove('hidden');
  });
  on('#qNx',()=>{if(i<qs.length-1){i++;render();}else result();});
 };
 const result=()=>{
  const pct=Math.round(right/qs.length*100),stars=pct>=90?3:pct>=70?2:1,pass=pct>=min;
  openModal(`${mHead(z.emoji,'Hasil '+o.title,z.name)}<div class="celebrate"><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><h2 style="font-size:1.8rem;margin:.4rem 0">${right} dari ${qs.length} benar (${pct}%)</h2><p class="lead">${pass?'Kerja bagus! Kamu berhak mendapat lencana. 🎉':'Hampir! Butuh minimal '+min+'% untuk lencana. Yuk coba lagi!'}</p></div>
   <div class="row end">${pass?'':'<button id="rTry" class="btn btn-amber">🔄 Coba Lagi</button>'}<button id="rGo" class="btn btn-green">${pass?'Ambil Lencana 🏆':'Keluar'}</button></div>`);
  on('#rTry',()=>{i=0;right=0;render();});
  on('#rGo',()=>pass?completeZone(o.id):closeModal());
 };
 render();
}
function builder(z){
 const chain=z.chain,extra=z.extra,pool=shuffle(extra?[...chain,extra]:[...chain]);let placed=0;
 openModal(`${mHead(z.emoji,z.name,'Eksperimen 1: Susun Rantai Makanan'+(practice?' • Latihan ulang':''))}
  <p class="lead">Klik makhluk hidup secara berurutan, mulai dari yang paling awal. Tanda ➜ artinya "dimakan oleh".</p>
  <div class="chain">${chain.map((c,i)=>`<div class="slot" id="sl${i}">?</div>${i<chain.length-1?'<div class="arr">➜</div>':''}`).join('')}</div>
  <div id="fb" class="fb">Ayo mulai! Siapa yang membuat makanannya sendiri?</div>
  <div class="pool">${pool.map((p,i)=>`<button class="pcard" data-i="${i}"><div class="pe">${esc(p.e)}</div><div class="pn">${esc(p.n)}</div></button>`).join('')}</div>
  <div class="row end"><button id="bNext" class="btn btn-green hidden">Lanjut ke Eksperimen 2 ▶</button></div>`);
 const fb=$('#fb');
 $$('#mbox .pcard').forEach(btn=>btn.onclick=()=>{
  if(placed>=chain.length)return;
  const p=pool[+btn.dataset.i];
  if(p===chain[placed]){
   const sl=$('#sl'+placed);sl.classList.add('fill');sl.innerHTML=`${esc(p.e)}<small>${esc(p.n)}</small><small class="role">${esc(p.r||'')}</small>`;
   btn.classList.add('used');placed++;sfx.ok();award('k2a',true,5);
   fb.className='fb good';fb.textContent=`✅ Benar! ${p.n}${p.r?' ('+p.r+')':''} berada di urutan ke-${placed}.`;
   if(placed===chain.length){fb.textContent='🎉 Rantai makanan lengkap! Energi mengalir dari produsen hingga konsumen puncak.';sfx.badge();$('#bNext').classList.remove('hidden');}
  }else{
   sfx.bad();award('k2a',false,5);btn.classList.add('bad');setTimeout(()=>btn.classList.remove('bad'),400);
   fb.className='fb warn';
   fb.textContent=(extra&&p===extra)?'💡 '+(extra.note||'Itu bukan bagian rantai pemangsaan.'):(placed===0?'💡 Rantai makanan selalu dimulai dari produsen, yaitu makhluk hidup yang membuat makanannya sendiri.':`💡 Belum tepat. Siapa yang memakan ${chain[placed-1].n}?`);
  }
 });
 on('#bNext',()=>whatIf(z));
}
function whatIf(z){
 const ch=z.chain,n=ch.length;let doneSet=new Set(),pending=false;
 const popsFor=i=>ch.map((_,j)=>{if(j===i)return 0;if(i===0)return Math.max(10,40-j*6);if(j<i){const d=i-j;return d===1?92:d===2?36:d===3?58:46;}const e=j-i;return e===1?18:e===2?32:40;});
 openModal(`${mHead(z.emoji,z.name,'Eksperimen 2: Bagaimana jika ... hilang?'+(practice?' • Latihan ulang':''))}
  <p class="lead">Pilih satu makhluk hidup untuk <b>dihilangkan</b> dari hutan, lalu tebak dampaknya. Lakukan minimal 2 percobaan berbeda!</p>
  <div class="pool" id="rm">${ch.map((c,i)=>`<button class="pcard" data-i="${i}"><div class="pe">${esc(c.e)}</div><div class="pn">${esc(c.n)}</div></button>`).join('')}</div>
  <div id="pq"></div>
  <div class="bars">${ch.map((c,i)=>`<div class="brow"><span class="be">${esc(c.e)}</span><div class="bt"><div class="bf" id="bf${i}" style="width:50%"></div></div><span class="bv" id="bv${i}">50</span></div>`).join('')}</div>
  <div id="ex" class="fb">Populasi awal setiap makhluk hidup seimbang (50).</div>
  <div class="row end"><button id="wDone" class="btn btn-green hidden">Selesaikan Eksperimen ✔</button></div>`);
 const setBars=(arr,ref)=>arr.forEach((v,j)=>{const f=$('#bf'+j);f.style.width=Math.max(v,3)+'%';f.className='bf'+(ref?(v===0?' gone':v>50?' up':v<50?' down':''):'');$('#bv'+j).textContent=v;});
 $$('#rm .pcard').forEach(btn=>btn.onclick=()=>{
  if(pending)return;
  const i=+btn.dataset.i;pending=true;sfx.click();
  $$('#rm .pcard').forEach(b=>b.classList.toggle('sel',b===btn));
  setBars(ch.map(()=>50),false);
  const tIdx=i>0?i-1:1,expect=i>0?'naik':'turun',tn=ch[tIdx].n;
  $('#pq').innerHTML=`<div class="qtxt" style="margin-top:.8rem">🔮 Prediksi: jika ${esc(ch[i].n)} hilang dari hutan, populasi ${esc(tn)} akan...</div><div class="opts" style="grid-template-columns:repeat(3,1fr)">${[['naik','⬆️ Naik'],['turun','⬇️ Turun'],['tetap','➡️ Tetap']].map(([v,l])=>`<button class="opt" data-v="${v}" style="justify-content:center">${l}</button>`).join('')}</div>`;
  $$('#pq .opt').forEach(ob=>ob.onclick=()=>{
   const ok=ob.dataset.v===expect;
   $$('#pq .opt').forEach(e=>{e.classList.add('dis');if(e.dataset.v===expect)e.classList.add('ok');});
   ob.classList.add(ok?'ok':'bad');ok?sfx.ok():sfx.bad();award('k2b',ok,10);
   setTimeout(()=>setBars(popsFor(i),true),150);
   let msg;
   if(i===0)msg=`Tanpa ${ch[0].n} (produsen), semua konsumen kehilangan sumber energi sehingga populasinya turun.`;
   else{msg=`${ch[i-1].n} naik karena pemangsanya (${ch[i].n}) hilang.`;if(ch[i+1])msg+=` ${ch[i+1].n} turun karena makanannya (${ch[i].n}) berkurang.`;}
   const ex=$('#ex');ex.className='fb '+(ok?'good':'warn');ex.textContent=(ok?'✅ Prediksimu tepat! ':'💡 Belum tepat. ')+msg+' Ekosistem harus dijaga tetap seimbang.';
   doneSet.add(i);btn.classList.add('used');pending=false;$$('#rm .pcard').forEach(b=>b.classList.remove('sel'));
   if(doneSet.size>=2)$('#wDone').classList.remove('hidden');
  });
 });
 on('#wDone',()=>completeZone(2));
}
function completeZone(id){
 const first=!S.done[id];
 if(first){S.done[id]=true;S.score+=20;}
 save();updateHud();sfx.badge();
 const z=zc(id),A=act(),all=A.every(q=>S.done[q]);
 const conf=Array.from({length:18},()=>`<span class="conf" style="left:${Math.random()*95}%;animation-delay:${Math.random()*1.2}s">${['⭐','🎉','🌟','🍀','🦋'][Math.random()*5|0]}</span>`).join('');
 openModal(`<div class="celebrate">${conf}<div class="trophy">🏆</div><h2 style="font-size:2rem">${first?'Lencana Diperoleh!':'Latihan Selesai!'}</h2><p class="lead" style="font-size:1.1rem">${esc(z.name)}${first?' • +20 poin bonus':''}</p>${all?'<p class="lead">🎉 Semua zona telah kamu selesaikan!</p>':''}
  <div class="row" style="justify-content:center">${all?'<button id="cRep" class="btn btn-blue">📜 Lihat Laporan Penjelajah</button>':''}<button id="cGo" class="btn btn-green">${all?'Tetap Menjelajah':'Lanjut Menjelajah 🌳'}</button></div></div>`);
 on('#cRep',()=>{closeModal();finish();});
 on('#cGo',closeModal);
}
function confirmEnd(){
 sfx.click();
 openModal(`${mHead('🏁','Akhiri Penjelajahan?','Lihat Expedition Learning Report')}<p class="lead">Zona yang belum selesai akan tercatat belum dikuasai. Yakin ingin melihat laporanmu sekarang?</p><div class="row end"><button id="eNo" class="btn btn-ghost">Batal</button><button id="eYes" class="btn btn-green">Ya, Lihat Laporan</button></div>`);
 on('#eNo',closeModal);on('#eYes',()=>{closeModal();finish();});
}
function finish(){S.finishedAt=new Date().toISOString();save();showReport();}

/* ============ LAPORAN ============ */
const fmtDur=s=>{s=Math.round(s);const m=Math.floor(s/60);return m+' mnt '+String(s%60).padStart(2,'0')+' dtk';};
function metrics(){
 const A=act(),d=A.filter(z=>S.done[z]).length,acc=S.tot?Math.round(S.ok/S.tot*100):0;
 return{d,tot:A.length,acc,rows:subs().map(s=>{const m=S.m[s.k],has=!!(m&&m.t);return{l:s.l,p:has?Math.round(m.c/m.t*100):0,has};})};
}
function showReport(){
 show('report');stopMusic();
 const M=metrics(),when=new Date(S.finishedAt||Date.now());
 const dt=when.toLocaleString('id-ID',{dateStyle:'full',timeStyle:'short'});
 const pred=M.acc>=85?'Penjelajah Ahli ⭐⭐⭐':M.acc>=65?'Penjelajah Mahir ⭐⭐':'Penjelajah Pemula ⭐';
 $('#repBody').innerHTML=`
  <div style="text-align:center"><div style="font-size:2.4rem">🌿🏅🔬</div><h1 style="font-size:2rem;line-height:1.1">Expedition Learning Report</h1>
  <div style="font-weight:800;margin-top:.3rem">${esc(CFG.school)}</div>
  <div style="font-weight:700;color:#5b7a6a">${esc(CFG.topic)} • ${esc(CFG.jenjang)} • Kelas ${esc(CFG.kelas)} / Fase ${esc(CFG.fase)}</div>
  <div style="font-size:.85rem;font-weight:700;color:#5b7a6a">Diselesaikan: ${esc(dt)}</div><div style="font-size:.85rem;font-weight:700;color:#5b7a6a">Kode Paket Soal: ${setCode()}</div></div>
  <div style="display:flex;align-items:center;gap:1rem;margin-top:1rem;background:#f0fdf4;border-radius:1rem;padding:.6rem 1rem"><canvas id="repAv" width="100" height="120" style="width:70px;height:84px"></canvas><div><div style="font-size:.8rem;font-weight:800;color:#5b7a6a">NAMA PENJELAJAH</div><div class="title" style="font-size:1.6rem;font-weight:800;line-height:1.1">${esc(S.name)}</div><div style="font-weight:800">Kelas ${esc(S.kelas)}</div></div><div style="margin-left:auto;text-align:right"><div style="font-size:.8rem;font-weight:800;color:#5b7a6a">PREDIKAT</div><div class="title" style="font-weight:800;font-size:1.15rem">${pred}</div></div></div>
  <div class="metrics"><div class="met"><b>⭐ ${S.score}</b><span>Skor Akhir</span></div><div class="met"><b>🏆 ${M.d} / ${M.tot}</b><span>Lencana Terkumpul</span></div><div class="met"><b>${M.acc}%</b><span>Akurasi Latihan (${S.ok}/${S.tot})</span></div><div class="met"><b style="font-size:1.25rem;padding:.25rem 0">⏱️ ${fmtDur(S.elapsed)}</b><span>Durasi Menjelajah</span></div></div>
  <h3 style="font-size:1.2rem;margin-bottom:.3rem">📊 Tabel Penguasaan Konsep</h3>
  <table class="mt2"><thead><tr><th>Sub-materi</th><th>Penguasaan</th><th style="text-align:right">Nilai</th></tr></thead><tbody>${M.rows.map(r=>`<tr><td>${esc(r.l)}</td><td><div class="pb"><i style="width:${r.p}%"></i></div></td><td class="pc">${r.has?r.p+'%':'Belum'}</td></tr>`).join('')}</tbody></table>
  <div style="display:flex;justify-content:space-between;margin-top:2rem;font-weight:700;font-size:.9rem"><div style="text-align:center">Mengetahui,<br>Guru Kelas<br><br><br>( ........................ )</div><div style="text-align:center">Penjelajah<br><br><br><br>( ${esc(S.name)} )</div></div>`;
 drawPerson($('#repAv').getContext('2d'),50,110,AV[S.av]||AV[0],'down',0,false,1.9);
}
function csv(){
 const M=metrics(),when=new Date(S.finishedAt||Date.now());
 const head=['Nama','Kelas','Instansi','Topik','Jenjang','Kelas/Fase','Tanggal Selesai','Kode Paket Soal','Skor','Lencana','Total Lencana','Akurasi (%)','Durasi (detik)',...M.rows.map(r=>'Penguasaan: '+r.l+' (%)')];
 const row=[S.name,S.kelas,CFG.school,CFG.topic,CFG.jenjang,CFG.kelas+'/'+CFG.fase,when.toLocaleString('id-ID'),setCode(),S.score,M.d,M.tot,M.acc,Math.round(S.elapsed),...M.rows.map(r=>r.has?r.p:0)];
 return '\uFEFF'+[head,row].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
}
$('#btnCsv').onclick=()=>{sfx.click();const b=new Blob([csv()],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='laporan_'+(S.name||'siswa').replace(/[^\w-]+/g,'_')+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);};
$('#btnPrint').onclick=()=>{sfx.click();window.print();};
$('#btnAgain').onclick=()=>{sfx.click();const keep={name:S.name,kelas:S.kelas,av:S.av};S=Object.assign(defState(),keep);save();$('#inName').value=S.name;$('#inKelas').value=S.kelas;buildAvatars();show('reg');};

/* ============ PENGATURAN GURU ============ */
function openConfig(){
 const c=CFG;
 const lv=[[1,'Level 1 - Dasar / Pengenalan','Orientasi konsep & dialog NPC ahli'],[2,'Level 2 - Eksperimen Interaktif','Manipulasi objek konsep & pembuktian'],[3,'Level 3 - Tantangan Mandiri / Uji Pemahaman','Kuis studi kasus & evaluasi akhir']];
 openModal(`${mHead('⚙️','Pengaturan Guru','Konfigurasi materi & level permainan')}
 <div style="display:grid;gap:.7rem">
  <div><label class="lbl">Nama Mata Pelajaran & Topik Materi</label><input id="cTopic" class="input" value="${esc(c.topic)}"></div>
  <div><label class="lbl">Nama Satuan Pendidikan</label><input id="cSchool" class="input" value="${esc(c.school)}"></div>
  <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:.5rem">
   <div><label class="lbl">Jenjang</label><select id="cJen" class="input">${['TK/RA','SD/MI','SMP/MTs','SMA/SMK/MA'].map(j=>`<option${j===c.jenjang?' selected':''}>${j}</option>`).join('')}</select></div>
   <div><label class="lbl">Kelas</label><input id="cKelas" class="input" value="${esc(c.kelas)}"></div>
   <div><label class="lbl">Fase</label><select id="cFase" class="input">${['A','B','C','D','E','F'].map(j=>`<option${j===c.fase?' selected':''}>${j}</option>`).join('')}</select></div>
  </div>
  <div><label class="lbl">Tingkatan / Level Permainan (zona aktif)</label>${lv.map(([i,t,d])=>`<label class="chk"><input type="checkbox" class="cLv" value="${i}"${c.levels.includes(i)?' checked':''}><span>${t}<br><small style="font-weight:600;color:#5b7a6a">${d}</small></span></label>`).join('')}</div>
  <div><label class="lbl">Konten Materi (JSON) - ubah dialog, soal, dan rantai sesuai materi Anda</label><textarea id="cJson" rows="9" class="input mono">${esc(JSON.stringify(c.content,null,2))}</textarea>
  <small style="font-weight:600;color:#5b7a6a">Gunakan {nama} untuk menyapa siswa. Isi z1.check dan z3.quiz sebagai BANK SOAL (makin banyak makin bervariasi); tiap siswa dan tiap sesi jelajah mendapat set acak berbeda sebanyak z1.pick / z3.pick (bawaan 3 dan 5). Soal: q (pertanyaan), o (opsi), a (indeks jawaban benar mulai 0), w (pembahasan), img (emoji ilustrasi).</small></div>
  <div id="cErr" class="err"></div>
 </div>
 <div class="row end"><button id="cReset" class="btn btn-ghost">↺ Reset ke Contoh</button><button id="cWipe" class="btn btn-red">🗑️ Hapus Progres</button><button id="cSave" class="btn btn-green">💾 Simpan</button></div>`);
 on('#cReset',()=>{$('#cJson').value=JSON.stringify(DEFAULT_CONTENT,null,2);$('#cTopic').value=DEFAULT_CFG.topic;$('#cErr').textContent='Konten dikembalikan ke contoh. Tekan Simpan untuk menerapkan.';});
 on('#cWipe',()=>{S=defState();save();$('#inName').value='';$('#inKelas').value='';buildAvatars();$('#cErr').textContent='Progres siswa dihapus.';});
 on('#cSave',()=>{
  let content;try{content=JSON.parse($('#cJson').value);}catch(e){$('#cErr').textContent='JSON tidak valid: '+e.message;sfx.bad();return;}
  const er=contentErr(content);if(er){$('#cErr').textContent=er;sfx.bad();return;}
  const lvs=$$('.cLv').filter(x=>x.checked).map(x=>+x.value);if(!lvs.length){$('#cErr').textContent='Pilih minimal satu level.';sfx.bad();return;}
  CFG={topic:$('#cTopic').value.trim()||DEFAULT_CFG.topic,school:$('#cSchool').value.trim()||DEFAULT_CFG.school,jenjang:$('#cJen').value,kelas:$('#cKelas').value.trim()||'5',fase:$('#cFase').value,levels:lvs,content};
  saveCfg();applyCfg();sfx.ok();closeModal();toast('✅ Pengaturan disimpan');
 });
}

/* ============ INISIALISASI ============ */
$('#cfgBtn').onclick=()=>{ac();sfx.click();openConfig();};
$('#startBtn').onclick=()=>{
 ac();
 const name=$('#inName').value.trim(),kelas=$('#inKelas').value.trim();
 if(!name){toast('✍️ Tuliskan namamu dulu ya!');sfx.bad();$('#inName').focus();return;}
 if(!kelas){toast('🏫 Isi kelas / ruangmu dulu ya!');sfx.bad();$('#inKelas').focus();return;}
 if(S.av<0){toast('🧑‍🚀 Pilih avatar karakter dulu ya!');sfx.bad();return;}
 S=Object.assign(defState(),{name,kelas,av:S.av,screen:'game'});newSeed();
 sfx.badge();show('game');updateHud();startMusic();setTimeout(()=>robotTalk(true),300);
};
$('#audBtn').onclick=()=>{ac();muted=!muted;$('#audBtn').textContent=muted?'🔇':'🔊';if(muted)stopMusic();else{startMusic();sfx.click();}};
$('#endBtn').onclick=confirmEnd;
$('#modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal'&&false)closeModal();});
setInterval(()=>{if(S.screen==='game')save();},4000);
document.addEventListener('pointerdown',()=>{if(S.screen==='game'&&!muted){ac();startMusic();}},{once:false});

buildGround();applyCfg();
$('#inName').value=S.name||'';$('#inKelas').value=S.kelas||'';
buildAvatars();
if(S.screen==='game'){if(S.av<0)S.av=0;show('game');updateHud();toast('✨ Progres dilanjutkan, '+S.name+'!');}
else if(S.screen==='report'){showReport();}
else show('reg');
resize();
requestAnimationFrame(frame);
})();
</script>
